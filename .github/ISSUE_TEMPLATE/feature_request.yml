name: 🚀 Feature Request (Mobile)
description: Have an idea for the Android app? Pitch it!
title: "[Feat][APK]: "
labels: ["enhancement", "triage", "mobile"]
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Feature Proposal — Vivi Music (Android)
        Help us make Vivi Music even more awesome.
        > This template is for the **mobile / Android** app.
        > For the desktop app (Windows / Linux / macOS), use the **🚀 Feature Request (Vivi Music DE)** template.

  - type: dropdown
    id: category
    attributes:
      label: 🏷️ Category
      options:
        - ✨ New Feature
        - 🎨 UI / Design Improvement
        - ⚡ Performance / Optimization
        - 🎧 Audio Experience
        - 🌐 Translation / Localization
        - 🔧 Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 📝 The Pitch
      description: Describe your idea clearly. How should it work?
      placeholder: "I would love to see..."
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 🤝 Problem Solved
      description: Why is this feature necessary? What problem does it solve for you?
      placeholder: "Currently, it is difficult to..."
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: 🎨 Mockups / Screenshots / Extras
      description: Drop images or sketches here if you have them!
