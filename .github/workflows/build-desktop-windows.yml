name: Build Desktop (Windows)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows packages (MSI + EXE)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      WINDOWS_SIGNING_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
      WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Package desktop distribution
        shell: bash
        run: ./gradlew :desktop:packageMsi :desktop:packageExe --no-daemon

      - name: Collect packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp desktop/build/compose/binaries/main/msi/*.msi dist/
          for f in desktop/build/compose/binaries/main/exe/*.exe; do
            base="$(basename "$f" .exe)"
            cp "$f" "dist/${base}-portable.exe"
          done
          ls -la dist

      - name: Sign packages
        if: ${{ env.WINDOWS_SIGNING_CERT != '' }}
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing-cert.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT))
          Get-ChildItem dist -Recurse -Include *.msi,*.exe | ForEach-Object {
            Write-Host "Signing $($_.FullName)"
            & $signtool sign /f $pfx /p $env:WINDOWS_SIGNING_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signtool failed for $($_.FullName) (exit $LASTEXITCODE)" }
          }

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          path: dist/*
          if-no-files-found: error
