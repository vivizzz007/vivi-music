name: Build Desktop (Linux)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: Linux DEB package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Package DEB
        shell: bash
        run: ./gradlew :desktop:packageDeb --no-daemon

      - name: Collect DEB
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          DE="$(sed -n '2p' version.txt | tr -d '\r\n' | xargs)"
          VERSION="${MOBILE}_DE-${DE}"
          mkdir -p dist
          cp desktop/build/compose/binaries/main/deb/*.deb "dist/VIVIMusic-${VERSION}.deb"
          ls -la dist

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-deb
          path: dist/*
          if-no-files-found: error

  appimage:
    name: Linux AppImage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Best-effort: a failure here must not block the DEB (or the release).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Create app image
        shell: bash
        run: ./gradlew :desktop:createDistributable --no-daemon

      - name: Build AppImage
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          DE="$(sed -n '2p' version.txt | tr -d '\r\n' | xargs)"
          VERSION="${MOBILE}_DE-${DE}"
          # jpackage --type app-image produces a directory, not a single-file
          # .AppImage. Wrap it into an AppDir (AppRun + .desktop + icon) and pack
          # it with appimagetool so Arch / other distros get a portable AppImage.
          APPDIR="$(find desktop/build/compose/binaries/main/app -maxdepth 1 -mindepth 1 -type d | head -n 1)"
          if [ -z "$APPDIR" ]; then
            echo "jpackage app-image directory not found" >&2
            exit 1
          fi
          echo "AppDir: $APPDIR"

          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          if [ -x "$HERE/bin/VIVIMusic" ]; then exec "$HERE/bin/VIVIMusic" "$@"; fi
          if [ -x "$HERE/VIVIMusic" ]; then exec "$HERE/VIVIMusic" "$@"; fi
          for f in "$HERE"/bin/*; do
            if [ -x "$f" ] && [ ! -d "$f" ]; then exec "$f" "$@"; fi
          done
          echo "VIVIMusic: no executable found" >&2
          exit 1
          EOF
          chmod +x "$APPDIR/AppRun"

          cat > "$APPDIR/vivimusic.desktop" <<'EOF'
          [Desktop Entry]
          Name=VIVI Music
          Comment=Expressive YouTube Music client for desktop
          Exec=AppRun
          Icon=vivimusic
          Terminal=false
          Type=Application
          Categories=AudioVideo;Audio;Player;
          EOF

          cp desktop/icons/logo_vmde.png "$APPDIR/vivimusic.png"

          # appimagetool is itself an AppImage; extract it to avoid the FUSE
          # requirement on the runner, then run the extracted AppRun.
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O appimagetool.AppImage
          chmod +x appimagetool.AppImage
          ./appimagetool.AppImage --appimage-extract >/dev/null
          mkdir -p desktop/build/compose/binaries/main/appImage
          ARCH=x86_64 ./squashfs-root/AppRun "$APPDIR" "desktop/build/compose/binaries/main/appImage/VIVIMusic-${VERSION}.AppImage"

      - name: Collect AppImage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          APPIMAGE="$(find desktop/build -name '*.AppImage' -print -quit)"
          if [ -n "$APPIMAGE" ]; then
            cp "$APPIMAGE" dist/
            ls -la dist
          else
            echo "No AppImage produced; skipping artifact upload."
          fi

      - name: Upload AppImage
        if: hashFiles('dist/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-appimage
          path: dist/*
          if-no-files-found: error
