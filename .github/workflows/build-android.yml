name: Build Android APK

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android APKs (GMS + FOSS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        shell: bash
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore/release.keystore

      - name: Build GMS release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Build FOSS release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          mkdir -p dist
          GMS="$(find app/build/outputs/apk/universalGms/release -name '*.apk' -print -quit)"
          FOSS="$(find app/build/outputs/apk/universalFoss/release -name '*.apk' -print -quit)"
          if [ -n "$GMS" ]; then cp "$GMS" "dist/VIVIMusic-${MOBILE}-gms.apk"; fi
          if [ -n "$FOSS" ]; then cp "$FOSS" "dist/VIVIMusic-${MOBILE}-foss.apk"; fi
          ls -la dist
          [ -n "$GMS" ] || [ -n "$FOSS" ] || { echo "No APKs produced" >&2; exit 1; }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/*
          if-no-files-found: error
