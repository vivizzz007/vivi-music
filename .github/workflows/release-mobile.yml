name: Mobile APK for Desktop Release

# This is the mobile CI (release.yml) adapted for the desktop branch
# (`vivi-music-de`). It builds and signs the Android APKs, then — instead of
# publishing its own release — attaches them to the release created by
# `auto-release.yml`, so the APKs show up among the desktop release assets.

on:
  workflow_dispatch:
  push:
    branches: [ vivi-music-de ]

permissions:
  contents: write

jobs:
  build_and_attach:
    name: Build & attach APKs to the desktop release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    # Align with the auto-release trigger: manual dispatch, or a push whose
    # commit message starts with "v".
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'v'))

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode release keystore
        shell: bash
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore/release.keystore

      - name: Build GMS release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Build FOSS release APK
        shell: bash
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary -x lint

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          mkdir -p release_assets
          GMS="$(find app/build/outputs/apk/universalGms/release -name '*.apk' -print -quit)"
          FOSS="$(find app/build/outputs/apk/universalFoss/release -name '*.apk' -print -quit)"
          [ -n "$GMS" ] && cp "$GMS" "release_assets/VIVIMusic-${MOBILE}-gms.apk"
          [ -n "$FOSS" ] && cp "$FOSS" "release_assets/VIVIMusic-${MOBILE}-foss.apk"
          ls -la release_assets
          [ -n "$GMS" ] || [ -n "$FOSS" ] || { echo "No APKs produced" >&2; exit 1; }

      - name: Attach APKs to the desktop release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          MOBILE="$(sed -n '1p' version.txt | tr -d '\r\n' | xargs)"
          DE="$(sed -n '2p' version.txt | tr -d '\r\n' | xargs)"
          CHANNEL="$(sed -n '3p' version.txt | tr -d '\r\n' | xargs | tr '[:upper:]' '[:lower:]')"
          FULL="${MOBILE}_DE-${DE}"
          if [[ "$CHANNEL" == "stable" || -z "$CHANNEL" ]]; then TAG="$FULL"; else TAG="$FULL-$CHANNEL"; fi
          echo "Target desktop release tag: $TAG"
          # The desktop release is created by auto-release.yml (which builds the
          # installers first), so wait for it and then attach the APKs.
          for i in $(seq 1 135); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" release_assets/*.apk --clobber
              echo "Uploaded APKs to $TAG"
              exit 0
            fi
            echo "Waiting for the auto-release to publish $TAG ($i/135)..."
            sleep 20
          done
          echo "Release $TAG did not appear within 45 minutes; APKs not attached." >&2
          exit 1
