name: Desktop Build

on:
  workflow_dispatch:
  push:
    branches: [ main, beta ]
    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'NEW-UI/**'
      - 'fastlane/**'
      - '.github/**/*.md'

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows (MSI + EXE)
            tasks: ':desktop:packageMsi :desktop:packageExe'
          - os: ubuntu-latest
            name: Linux (DEB + AppImage)
            tasks: ':desktop:packageDeb :desktop:packageAppImage'
          - os: macos-13
            name: macOS (DMG + PKG)
            tasks: ':desktop:packageDmg :desktop:packagePkg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build native packages
        run: ./gradlew ${{ matrix.tasks }} --no-daemon --console=plain

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: vivi-desktop-${{ matrix.name }}
          path: desktop/build/compose/binaries/main/**/*
          if-no-files-found: error
          retention-days: 30
