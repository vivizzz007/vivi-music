name: Deploy Website (GitHub Pages)

on:
  workflow_dispatch:
  push:
    branches: [ vivi-music-de ]
    paths:
      - '.websitede/**'

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; a newer push cancels an older one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .websitede

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4