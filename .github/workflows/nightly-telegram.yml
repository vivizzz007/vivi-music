name: Nightly Telegram Build

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  build:
    name: Build and Send APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Beta Branch)
        uses: actions/checkout@v4
        with:
          ref: 'beta'
          fetch-depth: 2 # needed for checking recent commits

      - name: Check for new commits
        id: check_commits
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Get the timestamp of the latest commit
            LATEST_COMMIT=$(git log -1 --format=%ct)
            CURRENT_TIME=$(date +%s)
            diff=$((CURRENT_TIME - LATEST_COMMIT))
            
            # 24 hours = 86400 seconds
            if [ $diff -gt 86400 ]; then
              echo "No new commits in the last 24 hours."
              echo "cancel=true" >> "$GITHUB_OUTPUT"
            else
              echo "New commits found!"
              echo "cancel=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # For manual triggers, always run
            echo "cancel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17 (Zulu)
        if: steps.check_commits.outputs.cancel == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.check_commits.outputs.cancel == 'false'
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: steps.check_commits.outputs.cancel == 'false'
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore/release.keystore

      - name: Build APK (Universal GMS Release)
        if: steps.check_commits.outputs.cancel == 'false'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease --no-daemon

      - name: Find APK Path
        if: steps.check_commits.outputs.cancel == 'false'
        id: find_apk
        run: |
          # Search entire app/build directory to reliably find the APK
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "Found APK at: $APK_FILE"
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          echo "APK_PATH=$APK_FILE" >> "$GITHUB_ENV"

      - name: Upload APK to Telegram
        if: steps.check_commits.outputs.cancel == 'false'
        run: |
          CAPTION=$'🚀 New ViviMusic Nightly Build!\nCommit: ${{ github.sha }}'
          curl -s -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F message_thread_id="${{ secrets.TELEGRAM_THREAD_ID }}" \
               -F document=@"$GITHUB_WORKSPACE/${{ env.APK_PATH }}" \
               -F caption="$CAPTION" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
