name: Nightly Telegram Build

on:
  schedule:
    - cron: '0 0 * * *' # Midnight UTC
  workflow_dispatch: # Allows you to manually trigger it for testing

jobs:
  build:
    name: Build and Send APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository (Beta Branch)
        uses: actions/checkout@v4
        with:
          ref: 'beta'
          fetch-depth: 2 # needed for checking recent commits

      - name: Check for new commits
        id: check_commits
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            # Get the timestamp of the latest commit
            LATEST_COMMIT=$(git log -1 --format=%ct)
            CURRENT_TIME=$(date +%s)
            diff=$((CURRENT_TIME - LATEST_COMMIT))
            
            # 24 hours = 86400 seconds
            if [ $diff -gt 86400 ]; then
              echo "No new commits in the last 24 hours."
              echo "cancel=true" >> "$GITHUB_OUTPUT"
            else
              echo "New commits found!"
              echo "cancel=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # For manual triggers, always run
            echo "cancel=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17 (Zulu)
        if: steps.check_commits.outputs.cancel == 'false'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.check_commits.outputs.cancel == 'false'
        run: chmod +x gradlew

      - name: Decode Release Keystore
        if: steps.check_commits.outputs.cancel == 'false'
        run: |
          mkdir -p app/keystore
          echo "${{ secrets.KEYSTORE }}" | base64 --decode > app/keystore/release.keystore

      - name: Build APK (Universal GMS Release)
        if: steps.check_commits.outputs.cancel == 'false'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease --no-daemon

      - name: Find APK Path
        if: steps.check_commits.outputs.cancel == 'false'
        id: find_apk
        run: |
          RAW_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1 | tr -d '\r')
          if [ -z "$RAW_PATH" ]; then
            RAW_PATH=$(find app/build -name "*.apk" | head -n 1 | tr -d '\r')
          fi
          if [ -z "$RAW_PATH" ]; then
            echo "ERROR: No APK file found!"
            exit 1
          fi
          FULL_PATH=$(realpath "$RAW_PATH" | tr -d '\r')
          echo "Found APK at: $FULL_PATH"
          FILE_SIZE=$(du -h "$FULL_PATH" | cut -f1 | tr -d '\r')
          echo "APK Size: $FILE_SIZE"
          echo "APK_PATH=$FULL_PATH" >> "$GITHUB_ENV"
          echo "APK_SIZE=$FILE_SIZE" >> "$GITHUB_ENV"

      - name: Upload APK to Telegram
        if: steps.check_commits.outputs.cancel == 'false'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_THREAD_ID: ${{ secrets.TELEGRAM_THREAD_ID }}
          COMMIT_SHA: ${{ github.sha }}
        run: python3 scripts/send_telegram.py
