name: Build and Release Pipeline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Prepare 4-Part Semantic Version and Changelog
        id: prep_release
        run: |
          RAW_VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/' | head -1)
          BASE_VERSION=$(echo "$RAW_VERSION" | awk -F. '{print $1"."$2"."$3}')
          FULL_VERSION="${BASE_VERSION}.${{ github.run_number }}"
          echo "full_version=${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "base_version=${BASE_VERSION}" >> $GITHUB_OUTPUT
          echo "Building Vivi Music version: ${FULL_VERSION}"

          # Patch build.gradle.kts with the four-part version so compiled APK matches GitHub release tag
          sed -i "s/versionName = \".*\"/versionName = \"${FULL_VERSION}\"/" app/build.gradle.kts

          # Generate changelog from recent commits since previous release tag
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"* %s (%h)" --no-merges)
          else
            COMMITS=$(git log -n 10 --pretty=format:"* %s (%h)" --no-merges)
          fi
          if [ -z "$COMMITS" ]; then
            COMMITS="* Performance optimizations and stability improvements"
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "## What's Changed in v${FULL_VERSION}" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Generate changelog.json for in-app updater
          mkdir -p release_meta
          export SCRIPT_FULL_VERSION="${FULL_VERSION}"
          export SCRIPT_COMMITS="${COMMITS}"
          python3 - << 'EOF'
          import json, os
          full_ver = os.environ.get("SCRIPT_FULL_VERSION", "")
          commits_raw = os.environ.get("SCRIPT_COMMITS", "")
          items = [line.lstrip('* ').strip() for line in commits_raw.split('\n') if line.strip()]
          data = {
              "version": full_ver,
              "description": f"Vivi Music v{full_ver}",
              "changelog": [{"title": "Improvements", "items": items if items else ["General stability and performance improvements"]}]
          }
          with open("release_meta/changelog.json", "w") as f:
              json.dump(data, f, indent=2)
          EOF

      - name: Decode Signing Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build Signed Release APK
        env:
          KEYSTORE_FILE: release.jks
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: ./gradlew assembleUniversalGmsRelease assembleUniversalFossRelease || ./gradlew assembleRelease

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.prep_release.outputs.full_version }}"
          name: "Vivi Music v${{ steps.prep_release.outputs.full_version }}"
          body: "${{ steps.prep_release.outputs.changelog }}"
          files: |
            app/build/outputs/apk/**/*.apk
            release_meta/changelog.json
