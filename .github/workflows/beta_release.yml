name: Beta Release Build

on:
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom Beta Tag (leave blank for automatic b<version>-r<run_number>)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  check_version:
    name: Check Version & Release Status
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    outputs:
      should_release: ${{ steps.check_release.outputs.exists == 'false' }}
      version_code: ${{ steps.version_info.outputs.version_code }}
      version_name: ${{ steps.version_info.outputs.version_name }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Version Info
        id: version_info
        run: |
          VERSION_CODE=$(grep "versionCode =" app/build.gradle.kts | tr -d ' ' | cut -d= -f2)
          RAW_VERSION=$(grep "versionName =" app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          CUSTOM_TAG="${{ inputs.custom_tag }}"
          if [ -n "$CUSTOM_TAG" ]; then
            VERSION_NAME="${CUSTOM_TAG#b}"
          else
            VERSION_NAME="$RAW_VERSION-r${{ github.run_number }}"
          fi
          echo "Extracted Version Code: $VERSION_CODE"
          echo "Extracted Version Name: $VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Check If Release Already Exists
        id: check_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME="${{ steps.version_info.outputs.version_name }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Workflow manually triggered via workflow_dispatch. Proceeding with release."
          elif gh release view "b$VERSION_NAME" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release b$VERSION_NAME already exists. Skipping release steps."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release b$VERSION_NAME does not exist. Proceeding with release."
          fi

  build_apks:
    name: Build & Sign (${{ matrix.name }})
    needs: check_version
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: foss
            name: Universal FOSS
            task: assembleUniversalFossRelease
            releaseDir: app/build/outputs/apk/universalFoss/release/
            artifactFile: izzydroid-universal-foss-release.apk
          - flavor: gms
            name: Universal GMS
            task: assembleUniversalGmsRelease
            releaseDir: app/build/outputs/apk/universalGms/release/
            artifactFile: vivi.apk

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Setup FFTW for Android
        uses: ./.github/actions/setup-fftw

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Generate debug.keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v \
            -keystore ~/.android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Release APK
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VIVI_GITHUB_CLIENT_ID: ${{ secrets.VIVI_GITHUB_CLIENT_ID }}
          VIVI_GITHUB_CLIENT_SECRET: ${{ secrets.VIVI_GITHUB_CLIENT_SECRET }}
        run: ./gradlew ${{ matrix.task }} -PbetaVersionName="b${{ needs.check_version.outputs.version_name }}" --no-configuration-cache --console=plain --warning-mode summary -x lint --max-workers=4

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2.0.0
        with:
          releaseDir: ${{ matrix.releaseDir }}
          signingKey: ${{ secrets.KEYSTORE }}
          keyAlias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
          buildToolsVersion: 35.0.0

      - name: Stage Artifact
        run: |
          mkdir -p staged_artifact
          cp "${{ steps.sign_apk.outputs.signedFile }}" staged_artifact/${{ matrix.artifactFile }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.flavor }}
          path: staged_artifact/${{ matrix.artifactFile }}
          retention-days: 1

  publish_release:
    name: Publish Beta Release
    needs: [check_version, build_apks]
    if: needs.check_version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download FOSS APK
        uses: actions/download-artifact@v4
        with:
          name: apk-foss
          path: release_assets

      - name: Download GMS APK
        uses: actions/download-artifact@v4
        with:
          name: apk-gms
          path: release_assets

      - name: Generate changelog.json
        env:
          VERSION_CODE: ${{ needs.check_version.outputs.version_code }}
          VERSION_NAME: ${{ needs.check_version.outputs.version_name }}
        shell: python
        run: |
          import os, json
          version_code = os.environ.get('VERSION_CODE')
          version_name = os.environ.get('VERSION_NAME')
          changelog_file = f"Changelog/Betamd/{version_code}.md"
          
          features = []
          fixes = []
          description = None
          image_url = "https://raw.githubusercontent.com/vivizzz007/vivi-music/main/assets/banner.png"
          for ext in ["png", "jpg"]:
              found = False
              for prefix in ["b", "v", ""]:
                  potential_file = f"NEW-UI/update/{prefix}{version_name}.{ext}"
                  if os.path.exists(potential_file):
                      image_url = f"https://raw.githubusercontent.com/vivizzz007/vivi-music/main/NEW-UI/update/{prefix}{version_name}.{ext}"
                      found = True
                      break
              if found:
                  break
          
          if os.path.exists(changelog_file):
              with open(changelog_file, 'r', encoding='utf-8') as f:
                  for line in f:
                      line_str = line.strip()
                      if not line_str:
                          continue
                      if line_str.lower().startswith("description::"):
                          description = line_str[len("description::"):].strip()
                      elif line_str.lower().startswith("image::"):
                          image_url = line_str[len("image::"):].strip()
                      else:
                          clean_line = line_str.lstrip("*-• ").strip()
                          if "fix" in clean_line.lower() or "resolve" in clean_line.lower():
                              fixes.append(clean_line)
                          else:
                              features.append(clean_line)
          else:
              features.append("Bug fixes and performance improvements.")
              
          if not description:
              summary_items = []
              for feat in features[:3]:
                  val = feat
                  for prefix in ["added new ", "added a ", "added ", "updated new ", "updated ", "new "]:
                      if val.lower().startswith(prefix):
                          val = val[len(prefix):]
                          break
                  if val:
                      val = val[0].lower() + val[1:]
                  summary_items.append(val)
              
              if summary_items:
                  desc_text = "brings " + ", ".join(summary_items)
                  if len(features) > 3:
                      desc_text += ", and other improvements."
                  else:
                      desc_text += "."
                  if fixes:
                      desc_text += " It also includes several bug fixes."
                  description = f"VIVI MUSIC b{version_name} {desc_text}"
              else:
                  description = f"VIVI MUSIC b{version_name} brings new updates, features, and bug fixes."
                  
          changelog_sections = []
          if features:
              changelog_sections.append({
                  "title": "What's New",
                  "items": features
              })
          if fixes:
              changelog_sections.append({
                  "title": "Fixes & Improvements",
                  "items": fixes
              })
              
          changelog_sections.append({
              "title": "Support",
              "items": [
                  "Support development on Ko-fi: https://ko-fi.com/vividhpashokan",
                  "Support via UPI: vividhpashokan@axl",
                  "Support via PayPal: https://www.paypal.me/vividhpashokan"
              ]
          })
              
          data = {
              "version": version_name,
              "description": description,
              "image": image_url,
              "changelog": changelog_sections
          }
          
          with open("release_assets/changelog.json", "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)

      - name: Create GitHub Release & Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION_CODE="${{ needs.check_version.outputs.version_code }}"
          VERSION_NAME="${{ needs.check_version.outputs.version_name }}"
          NOTES_FILE="Changelog/Betamd/${VERSION_CODE}.md"
          
          if [ -f "$NOTES_FILE" ]; then
            cat "$NOTES_FILE" > release_notes.txt
          else
            echo "Release b$VERSION_NAME" > release_notes.txt
          fi
          echo -e "\n\n☕ Support development on Ko-fi: https://ko-fi.com/vividhpashokan\n💸 Support via UPI: vividhpashokan@axl\n💳 Support via PayPal: https://www.paypal.me/vividhpashokan" >> release_notes.txt
          
          gh release create "b$VERSION_NAME" release_assets/* \
            --title "VIVI-GITHUB-DROID b$VERSION_NAME" \
            --notes-file release_notes.txt \
            --prerelease \
            --target "${{ github.ref_name }}"
