name: Build Ctrl Music

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'fastlane/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p app/keystore
            echo "$KEYSTORE_BASE64" | base64 -d > app/keystore/release.keystore
            echo "Signing with the Ctrl Music release key"
          else
            echo "::warning::KEYSTORE_BASE64 secret not set - APK is signed with a temporary debug key"
          fi

      - name: Build APK (arm64)
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleArm64FossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Build APK (universal, releases only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleUniversalFossRelease --no-configuration-cache --console=plain --warning-mode summary

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/arm64Foss/release/*.apk dist/CtrlMusic.apk
          if ls app/build/outputs/apk/universalFoss/release/*.apk >/dev/null 2>&1; then
            cp app/build/outputs/apk/universalFoss/release/*.apk dist/CtrlMusic-universal.apk
          fi
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CtrlMusic-${{ github.sha }}
          path: dist/*.apk

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
