# Render Blueprint — one-click deploy of the VIVI Music sync relay.
#
# From the Render dashboard: New -> Blueprint -> select this repo (branch
# `vivi-music-de`). Render reads this file and creates the `vivimusic-device-sync`
# web service below. After the first deploy, set the client URL to
# `wss://<service-name>.onrender.com`.
services:
  - type: web
    name: vivimusic-device-sync
    runtime: node
    rootDir: sync-server
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
